<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script src="../../_ds_bundle.js"></script><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans)}#root{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}</style></head><body><div id="root"></div><script type="text/babel">
const {Icon,Button,IconButton,Fab,Badge,Avatar,AvatarStack,Checkbox,StatPill,ProgressBar,NavRail,AppHeader,MemberChip,EventCard,AllDayBar,DayHeader,TimeGutter,NowLine,ListPanel,ListRow,SectionLabel,TimeOfDayTabs,TaskRow,MemberColumn} = window.FamilyOSDesignSystem_68d940;
function Demo(){const [d,setD]=React.useState({Milk:true});const tog=k=>setD(p=>({...p,[k]:!p[k]}));return <>
<ListPanel title="Grocery List" count={5} tone="sand">
  {[['Eggs','🥚'],['Milk','🥛'],['Bread','🍞'],['Apples','🍎']].map(([l,e])=><ListRow key={l} label={l} emoji={e} tone="sand" checked={!!d[l]} onToggle={()=>tog(l)}/>)}
</ListPanel>
<ListPanel title="Packing List" count={15} tone="blush" footer={false}>
  {['Shirts x5','Jeans x2','Undies x7','Swimsuits x3'].map(l=><ListRow key={l} label={l} tone="blush" checked={!!d[l]} onToggle={()=>tog(l)}/>)}
</ListPanel>
<ListPanel title="Travel Bucket Li…" count={12} tone="teal" footer={false}>
  {[['Japan','🇯🇵'],['Ireland','🇮🇪'],['Croatia','🇭🇷'],['Spain','🇪🇸']].map(([l,e])=><ListRow key={l} label={l} emoji={e} tone="teal" checked={!!d[l]} onToggle={()=>tog(l)}/>)}
</ListPanel></>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
