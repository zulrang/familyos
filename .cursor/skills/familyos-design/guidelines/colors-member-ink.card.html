<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div class="wrap"><div class="sw" style="background:var(--member-teal-ink);color:#fff">Teal ink<code>--member-teal-ink</code></div><div class="sw" style="background:var(--member-blush-ink);color:#fff">Blush ink<code>--member-blush-ink</code></div><div class="sw" style="background:var(--member-lilac-ink);color:#fff">Lilac ink<code>--member-lilac-ink</code></div><div class="sw" style="background:var(--member-sage-ink);color:#fff">Sage ink<code>--member-sage-ink</code></div><div class="sw" style="background:var(--member-coral-ink);color:#fff">Coral ink<code>--member-coral-ink</code></div><div class="sw" style="background:var(--member-sand-ink);color:#fff">Sand ink<code>--member-sand-ink</code></div></div></body></html>
