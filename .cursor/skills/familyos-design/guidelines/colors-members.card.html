<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div class="wrap"><div class="sw" style="background:var(--member-teal);color:var(--text-title)">Teal<code>--member-teal</code></div><div class="sw" style="background:var(--member-blush);color:var(--text-title)">Blush<code>--member-blush</code></div><div class="sw" style="background:var(--member-lilac);color:var(--text-title)">Lilac<code>--member-lilac</code></div><div class="sw" style="background:var(--member-sage);color:var(--text-title)">Sage<code>--member-sage</code></div><div class="sw" style="background:var(--member-coral);color:var(--text-title)">Coral<code>--member-coral</code></div><div class="sw" style="background:var(--member-sand);color:var(--text-title)">Sand<code>--member-sand</code></div></div></body></html>
