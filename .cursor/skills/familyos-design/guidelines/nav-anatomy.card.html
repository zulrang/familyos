<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div style="display:flex;height:150px"><div style="width:90px;background:var(--surface-rail);display:flex;flex-direction:column"><div style="height:44px;background:var(--surface-rail-active);display:flex;align-items:center;justify-content:center;font:var(--fw-semibold) 20px/1 var(--font-display);color:var(--neutral-600)">F</div><div style="padding:10px 0;text-align:center;font:var(--type-nav-label);color:var(--neutral-600)">Calendar</div><div style="padding:10px 0;text-align:center;font:var(--type-nav-label);font-weight:var(--fw-bold);background:var(--member-sand-soft);color:var(--member-sand-ink);box-shadow:inset 5px 0 0 var(--member-sand-ink)">Lists</div><div style="padding:10px 0;text-align:center;font:var(--type-nav-label);color:var(--neutral-600)">Tasks</div></div><div style="flex:1;padding:16px;font:var(--type-card-meta);color:var(--text-muted)">Rail is always visible and never collapses. Each section owns a pastel tone. Active section = soft-tint slab in that tone bleeding to both rail edges, with an ink accent bar and bold ink label; no pill, no shadow.</div></div></body></html>
