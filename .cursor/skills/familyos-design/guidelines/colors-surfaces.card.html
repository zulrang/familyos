<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div class="wrap"><div class="sw" style="background:var(--surface-screen);color:var(--text-title)">Screen<code>--surface-screen</code></div><div class="sw" style="background:var(--surface-rail);color:var(--text-title)">Rail<code>--surface-rail</code></div><div class="sw" style="background:var(--surface-rail-active);color:var(--text-title)">Rail top<code>--surface-rail-active</code></div><div class="sw" style="background:var(--surface-sunken);color:var(--text-title)">Sunken<code>--surface-sunken</code></div><div class="sw" style="background:var(--border-hairline);color:var(--text-title)">Hairline<code>--border-hairline</code></div><div class="sw" style="background:var(--border-card);color:var(--text-title)">Border<code>--border-card</code></div></div></body></html>
