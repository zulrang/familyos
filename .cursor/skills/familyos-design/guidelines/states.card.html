<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div style="padding:16px;display:flex;gap:12px;align-items:flex-start">
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="background:var(--member-teal-soft);border-radius:var(--radius-list-row);padding:var(--pad-list-row);font:var(--type-card-meta)">Brush teeth · idle</div><div style="background:var(--member-teal);border-radius:var(--radius-list-row);padding:var(--pad-list-row);font:var(--type-card-meta);color:var(--text-title)">Brush teeth · done</div></div>
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="background:var(--member-sand);border-radius:var(--radius-list-row);padding:var(--pad-list-row);font:var(--type-card-meta)">Eggs</div><div style="background:var(--member-sand);border-radius:var(--radius-list-row);padding:var(--pad-list-row);font:var(--type-card-meta);opacity:.55;text-decoration:line-through">Milk</div></div></div></body></html>
