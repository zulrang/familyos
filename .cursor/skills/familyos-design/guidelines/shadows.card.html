<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Barely-there: raise for pills, card for panels, fab for the blue button" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div class="wrap" style="background:var(--surface-app)"><div style="flex:1;min-height:82px;background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-raise);display:flex;align-items:flex-end;padding:10px;font:var(--fw-bold) var(--fs-micro)/1.2 var(--font-sans)">Raise</div><div style="flex:1;min-height:82px;background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:10px;font:var(--fw-bold) var(--fs-micro)/1.2 var(--font-sans)">Card</div><div style="flex:1;min-height:82px;background:var(--white);border-radius:var(--radius-md);box-shadow:var(--shadow-panel);display:flex;align-items:flex-end;padding:10px;font:var(--fw-bold) var(--fs-micro)/1.2 var(--font-sans)">Panel</div><div style="flex:1;min-height:82px;background:var(--brand-blue);color:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-fab);display:flex;align-items:flex-end;padding:10px;font:var(--fw-bold) var(--fs-micro)/1.2 var(--font-sans)">Fab</div></div></body></html>
