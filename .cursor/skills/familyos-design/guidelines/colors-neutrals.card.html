<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-screen);font-family:var(--font-sans);color:var(--text-body)}.wrap{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}.sw{flex:1 1 0;min-width:74px;border-radius:var(--radius-md);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font:var(--fw-bold) var(--fs-micro)/1.3 var(--font-sans);min-height:84px}.sw code{font:var(--fw-semibold) 10px/1.3 var(--font-mono);opacity:.72}</style></head><body><div class="wrap"><div class="sw" style="background:var(--neutral-50);color:var(--text-title);min-width:52px">50</div><div class="sw" style="background:var(--neutral-100);color:var(--text-title);min-width:52px">100</div><div class="sw" style="background:var(--neutral-200);color:var(--text-title);min-width:52px">200</div><div class="sw" style="background:var(--neutral-300);color:var(--text-title);min-width:52px">300</div><div class="sw" style="background:var(--neutral-400);color:var(--text-title);min-width:52px">400</div><div class="sw" style="background:var(--neutral-500);color:#fff;min-width:52px">500</div><div class="sw" style="background:var(--neutral-600);color:#fff;min-width:52px">600</div><div class="sw" style="background:var(--neutral-700);color:#fff;min-width:52px">700</div><div class="sw" style="background:var(--neutral-800);color:#fff;min-width:52px">800</div><div class="sw" style="background:var(--neutral-900);color:#fff;min-width:52px">900</div></div></body></html>
