<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FamilyOS — Today page mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Static design mockups. Tokens are copied from src/app/globals.css; nothing here ships. */
:root{
--white:#fff;--neutral-50:#f7fafc;--neutral-100:#eef3f7;--neutral-200:#e3ebf1;--neutral-300:#d3dde5;--neutral-400:#a9b7c2;--neutral-500:#7d8b96;--neutral-600:#5c6a75;--neutral-700:#3f4b55;--neutral-800:#2e3a45;--neutral-900:#1f2a33;
--member-teal-soft:#d6ece9;--member-teal-ink:#2c5d58;--member-blush-soft:#fbe3e1;--member-blush-ink:#7d413d;--member-lilac-soft:#efe8f5;--member-lilac-ink:#54406b;--member-sage-soft:#e5f2e7;--member-sage-ink:#3a6144;--member-coral-soft:#fce0de;--member-coral-ink:#8a4340;--member-sand-soft:#fbf1e3;--member-sand-ink:#7a5a2c;
--brand-blue:#1878c8;--accent-coral:#ef6c4d;--accent-amber:#d9a02b;--now-line:#f4795d;
--surface-rail:#eef4f8;--surface-rail-active:#dcebf6;--surface-sunken:var(--neutral-50);--grid-line:var(--neutral-200);
--text-title:var(--neutral-900);--text-body:var(--neutral-800);--text-muted:var(--neutral-500);
--font-display:"Newsreader",Georgia,serif;--font-sans:"Nunito Sans","Segoe UI",system-ui,sans-serif;
--pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfd8df;font-family:var(--font-sans);color:var(--text-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;color:var(--text-title)}
svg.i{flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* --- mockup switcher (not part of the design) --- */
.bar{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#1f2a33;color:#fff;font:600 15px/1 var(--font-sans)}
.bar b{font:600 19px/1 var(--font-display);margin-right:10px}
.bar button{padding:10px 16px;border-radius:var(--pill);color:#c9d4dc;font:700 15px/1 var(--font-sans)}
.bar button[aria-pressed=true]{background:#fff;color:#1f2a33}
.bar span{margin-left:auto;color:#93a3af;font-weight:600}
.fit{position:absolute;top:56px;left:0;transform-origin:0 0}

/* --- shell --- */
.stage{width:1920px;height:1080px;display:flex;background:var(--white);overflow:hidden}
.rail{width:90px;flex:none;background:var(--surface-rail);display:flex;flex-direction:column}
.rail .brand{height:64px;display:flex;align-items:center;justify-content:center;font:600 24px/1 var(--font-display);color:var(--neutral-600);background:var(--surface-rail-active)}
.rail .items{flex:1;display:flex;flex-direction:column;min-height:0}
.rail .it{position:relative;flex:1 1 0;max-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:600 15px/1.2 var(--font-sans);color:var(--neutral-600)}
.rail .it.on{font-weight:700}
.rail .it.on::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:currentColor}
.screen{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:18px;padding:10px 28px;min-height:72px;flex:none}
.hdr h1{font:600 34px/1.1 var(--font-display);letter-spacing:-.01em}
.hdr .meta{font:600 22px/1 var(--font-sans)}
.hdr .date{color:var(--text-muted)}
.hdr .wx{display:inline-flex;align-items:center;gap:7px}
.hdr .wx svg{color:var(--accent-amber)}
.hdr .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.body{flex:1;min-height:0;display:flex;flex-direction:column}

/* --- shared atoms --- */
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--s,48px);height:var(--s,48px);border-radius:var(--pill);font:700 calc(var(--s,48px)*.42)/1 var(--font-sans)}
.av.ring{box-shadow:0 0 0 2px #fff}
.stack{display:inline-flex}
.stack .av+.av{margin-left:-8px}
.bar-p{display:block;height:7px;border-radius:var(--pill);background:#fff;overflow:hidden;flex:1;min-width:0}
.bar-p i{display:block;height:100%;border-radius:var(--pill);background:var(--ctl)}
.pal{color:var(--ink)}
.eyebrow{font:700 13px/1.3 var(--font-sans);letter-spacing:.06em;text-transform:uppercase}
.pill-btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:var(--pill);background:#fff;box-shadow:0 0 0 1px var(--neutral-200),0 1px 2px rgba(31,42,51,.06);font:700 16px/1.3 var(--font-sans)}

/* filter chips */
.chips{display:flex;gap:12px;padding:2px 28px 18px;flex:none}
.chip{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 22px 8px 8px;border-radius:var(--pill);border:2px solid transparent;background:var(--panel,var(--neutral-100));color:var(--ink,var(--text-body));font:700 19px/1.2 var(--font-sans)}
.chip small{font:600 15px/1 var(--font-sans);opacity:.8}
.chip[aria-pressed=true]{background:var(--hdr,var(--neutral-200));border-color:var(--ctl,var(--neutral-600))}
.chips.filtered .chip[aria-pressed=false]{background:var(--surface-sunken);color:var(--text-body);opacity:.55}
.chip .all{--s:48px;background:var(--neutral-300);color:var(--neutral-700)}

/* task rows + panel */
.trow{display:flex;align-items:center;gap:18px;min-height:var(--trow,84px);padding:12px 0;color:var(--ink);width:100%}
.trow+.trow{border-top:1px solid var(--hdr)}
.ck{flex:none;width:var(--ck,50px);height:var(--ck,50px);border-radius:var(--pill);border:2px solid var(--ctl);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.trow.done .ck{background:var(--ctl)}
.trow .t{font:600 var(--tt,24px)/1.3 var(--font-sans)}
.trow.done .t{text-decoration:line-through}
.trow .m{display:block;margin-top:3px;font:600 16px/1.3 var(--font-sans);opacity:.85}
.trow .star{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--pill);background:#fff3c4;color:#805719;font:700 16px/1 var(--font-sans)}
.tpanel{background:var(--panel);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tpanel>header{display:flex;align-items:center;gap:16px;padding:22px 26px;background:var(--hdr);border-top:6px solid var(--acc)}
.tpanel>header h2{font:600 32px/1.15 var(--font-display);color:inherit}
.tpanel>header p{margin-top:4px;font:600 17px/1.3 var(--font-sans)}
.tpanel .big{margin-left:auto;text-align:right;font:600 44px/1 var(--font-sans)}
.tpanel .big span{font-size:22px;margin-left:4px}
.tpanel .big .bar-p{width:150px;margin-top:10px}
.tpanel .rows{padding:6px 26px 16px;overflow:hidden}
.tpanel .sub{padding:16px 0 4px;border-top:1px solid var(--hdr);margin-top:6px}

/* events */
.ev{border-radius:14px;background:var(--fill);color:var(--ink);overflow:hidden}
.ev.house{background:var(--neutral-200);color:var(--neutral-800)}
.ev b{font:700 17px/1.25 var(--font-sans)}
.ev em{font:600 15px/1.25 var(--font-sans);font-style:normal}
.past{opacity:.55}
.nowdot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--now-line)}

/* ============ 1 · Lanes ============ */
.m1{flex:1;min-height:0;display:flex;flex-direction:column;padding-right:20px}
.m1 .cols{display:grid;grid-template-columns:76px repeat(5,minmax(0,1fr));column-gap:8px}
.lhead{display:block;padding:12px 16px 14px;border-radius:18px 18px 0 0;background:var(--hdr);border-top:6px solid var(--acc);color:var(--ink)}
.lhead .top{display:flex;align-items:center;gap:12px;font:600 28px/1.1 var(--font-display)}
.lhead .top small{margin-left:auto;font:700 17px/1 var(--font-sans)}
.lhead .bar-p{margin-top:12px}
.m1.filtered .lhead[aria-pressed=false]{background:var(--surface-sunken);border-top-color:var(--neutral-300);color:var(--text-body);opacity:.55}
.m1.filtered .lhead[aria-pressed=false] .av{background:var(--neutral-300)!important;color:var(--neutral-700)!important}
.m1.filtered .lhead[aria-pressed=false] .bar-p i{background:var(--neutral-400)}
.m1 .allday{padding:6px 0;row-gap:4px;border-bottom:1px solid var(--grid-line)}
.m1 .allday .lbl{font:600 15px/30px var(--font-sans);color:var(--text-muted);text-align:right;padding-right:12px}
.adbar{height:30px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:var(--pill);background:var(--fill,var(--neutral-200));color:var(--ink,var(--neutral-800));font:700 16px/1 var(--font-sans);white-space:nowrap;overflow:hidden}
.m1 .grid{position:relative;flex:1;min-height:0}
.m1 .grid .cols{height:100%}
.gutter{position:relative}
.gutter span{position:absolute;right:12px;font:600 16px/1 var(--font-sans);color:var(--text-muted);transform:translateY(-50%)}
.lane{position:relative;background-color:var(--panel);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--h) - 1px),rgba(31,42,51,.07) calc(var(--h) - 1px),rgba(31,42,51,.07) var(--h))}
.lane .ev,.over .ev{position:absolute;left:6px;right:6px;padding:8px 12px;display:flex;flex-direction:column}
.lane .ev.short,.over .ev.short{flex-direction:row;align-items:center;gap:10px;padding-block:0}
.lane .ev .stack{position:absolute;right:10px;bottom:8px}
.lane .ev.short .stack,.lane .ev.short .hh{position:static;margin:0 0 0 auto}
.over{position:absolute;top:0;bottom:0;left:84px;right:0;pointer-events:none}
.over .ev{left:0;right:0;flex-direction:row!important;align-items:center;gap:12px;padding:0 18px}
.nowline{position:absolute;left:-8px;right:0;height:3px;background:var(--now-line);z-index:5}
.nowline .nowdot{left:-4px;top:-4.5px}
.m1 .focus{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1.35fr);column-gap:8px;height:100%}
.m1 .focus .lane .ev b{font-size:21px}
.m1 .focus .lane .ev em{font-size:17px}
.m1 .focus .tpanel{margin:14px 0 20px 20px;align-self:start;max-height:calc(100% - 34px)}

/* ============ 2 · Agenda ============ */
.m2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;padding:0 28px 24px}
.m2 h2.sec{font:600 26px/1.2 var(--font-display);margin-bottom:12px}
.ag{display:flex;flex-direction:column;gap:6px}
.ag .r{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:center;gap:8px}
.ag .when{font:700 18px/1.2 var(--font-sans);text-align:right;padding-right:14px}
.ag .when small{display:block;font:600 14px/1.3 var(--font-sans);color:var(--text-muted)}
.ag .ev{display:flex;align-items:center;gap:14px;min-height:var(--agh,52px);padding:8px 14px 8px 20px}
.ag .ev b{font-size:var(--agt,20px)}
.ag .ev .stack{margin-left:auto}
.ag .ev .hh{margin-left:auto;font:600 15px/1 var(--font-sans);display:inline-flex;gap:6px;align-items:center}
.ag .now{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;margin:2px 0}
.ag .now span{font:700 15px/1 var(--font-sans);color:var(--accent-coral);text-align:right;padding-right:14px}
.ag .now i{position:relative;height:3px;background:var(--now-line);border-radius:2px}
.ag .now i .nowdot{left:-4px;top:-4.5px}
.fam{display:flex;flex-direction:column;gap:12px}
.famrow{display:grid;grid-template-columns:56px minmax(0,1fr) 24px;align-items:center;gap:4px 16px;padding:16px 20px;border-radius:18px;background:var(--panel);color:var(--ink);width:100%}
.famrow h3{font:600 28px/1.1 var(--font-display);color:inherit;display:flex;align-items:baseline;gap:12px}
.famrow h3 small{font:700 16px/1 var(--font-sans)}
.famrow .next{font:600 17px/1.3 var(--font-sans);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.famrow .bar-p{grid-column:2/4;margin-top:6px}

/* ============ 3 · Board ============ */
.m3{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 28px 24px}
.strip{display:flex;align-items:center;gap:10px;padding:0 0 16px}
.strip .lbl{font:600 22px/1 var(--font-display);margin-right:6px;color:var(--text-title)}
.strip .adbar{height:44px;padding:0 20px;font-size:17px}
.strip .adbar em{font:600 15px/1 var(--font-sans);font-style:normal;opacity:.8}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.card{background:var(--panel);color:var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.card .lhead{border-radius:0;width:100%}
.card .sec{padding:14px 18px 4px}
.card .sec+.sec{border-top:1px solid var(--hdr);margin-top:10px}
.card .erow{display:flex;gap:12px;align-items:baseline;padding:9px 0;font:600 19px/1.25 var(--font-sans)}
.card .erow time{flex:none;width:76px;font:700 15px/1.25 var(--font-sans)}
.card .erow.nxt{margin:4px -10px;padding:10px;border-radius:12px;background:var(--fill)}
.card .none{padding:10px 0;font:600 17px/1.3 var(--font-sans);opacity:.8}
.card .more{margin-top:auto;display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 18px;border-top:1px solid var(--hdr);font:700 16px/1 var(--font-sans);width:100%}
.hero{display:flex;align-items:center;gap:20px;padding:20px 28px;border-radius:24px;background:var(--hdr);border-top:6px solid var(--acc);color:var(--ink);margin-bottom:20px}
.hero h2{font:600 44px/1.05 var(--font-display);color:inherit}
.hero p{font:600 20px/1.3 var(--font-sans);margin-top:4px}
.hero .big{margin-left:auto;font:600 64px/1 var(--font-sans)}
.hero .big span{font-size:28px;margin-left:6px}
.hero .bar-p{flex:none;width:260px;height:10px}
.m3 .two{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.spanel{background:var(--panel);border-radius:24px;padding:20px 22px 22px;color:var(--ink)}
.spanel h3{font:600 28px/1.2 var(--font-display);color:inherit;margin-bottom:14px}
.spanel .ag .when small{color:inherit;opacity:.75}
.spanel .ag .r,.spanel .ag .now{grid-template-columns:100px minmax(0,1fr)}

/* ============ 4 · Day Parts ============ */
.m4{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:0 28px 24px}
.part{display:flex;flex-direction:column;border-radius:22px;background:var(--surface-sunken);padding:18px 16px;min-height:0}
.part.cur{background:var(--neutral-100);box-shadow:inset 0 0 0 2px var(--neutral-300)}
.part>header{display:flex;align-items:center;gap:12px;padding:0 6px 14px;color:var(--neutral-600)}
.part>header h2{font:600 28px/1.1 var(--font-display)}
.part>header small{font:600 15px/1 var(--font-sans);color:var(--text-muted)}
.part>header .nowb{margin-left:auto;padding:7px 14px;border-radius:var(--pill);background:var(--accent-coral);color:#fff;font:700 14px/1 var(--font-sans)}
.part .list{display:flex;flex-direction:column;gap:8px}
.part .ev{padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-height:68px}
.part .ev b{font-size:20px}
.part .ev em{grid-column:1;font-size:16px}
.part .ev .stack,.part .ev .hh{grid-row:1/3;grid-column:2}
.part .trow{--trow:68px;--tt:20px;--ck:44px;background:#fff;border-radius:14px;padding:10px 14px;gap:14px;border:none!important;box-shadow:inset 0 0 0 2px var(--hdr)}
.part .trow .m{font-size:15px}
.part .empty{padding:26px 6px;font:600 18px/1.3 var(--font-sans);color:var(--text-muted)}
.part .famrow{background:var(--panel);padding:12px 16px}
.part .famrow h3{font-size:24px}

/* ============ 5 · Swimlanes ============ */
.m5{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 24px 20px 0}
.sw{position:relative;display:flex;flex-direction:column;gap:6px}
.sw.fill{flex:1;min-height:0}
.swr{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}
.sw.fill .swr.mem{flex:1}
.swr .who{display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;border-radius:0 18px 18px 0;background:var(--hdr,transparent);color:var(--ink,var(--neutral-700));width:100%;height:100%}
.swr .who .n{font:600 26px/1.1 var(--font-display)}
.swr .who small{display:block;font:700 15px/1.2 var(--font-sans);margin-top:4px}
.swr .who .bar-p{flex:none;width:100%;margin-top:8px}
.track{position:relative;background-color:var(--panel,var(--surface-sunken));border-radius:0 14px 14px 0;background-image:linear-gradient(to right,rgba(31,42,51,.07) 1px,transparent 1px);background-size:calc(100%/14) 100%}
.track .ev{position:absolute;top:6px;bottom:6px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center}
.track .ev b{font-size:16px;line-height:1.2}
.track .ev em{font-size:14px;margin-top:2px}
.swr.axis{height:34px}
.swr.axis .track{background:none}
.swr.axis span{position:absolute;top:8px;transform:translateX(-50%);font:600 16px/1 var(--font-sans);color:var(--text-muted);white-space:nowrap}
.swr.ad{height:42px}
.swr.ad .track{display:flex;gap:8px;align-items:center;background:none;padding-left:6px}
.swr.ad .who,.swr.hh .who{font:600 20px/1 var(--font-display);color:var(--neutral-600)}
.swr.hh{height:64px}
.swr.thin{height:60px;flex:none!important}
.swr.thin .who .n{font-size:21px}
.swr.thin .who small,.swr.thin .who .bar-p,.swr.thin .ev em{display:none}
.swr.thin .ev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swr.thin{opacity:.6}
.swr.sel{height:132px;flex:none!important}
.sw .vnow{position:absolute;top:34px;bottom:0;width:3px;background:var(--now-line);z-index:5;pointer-events:none}
.sw .vnow .nowdot{top:-5px;left:-4.5px}
.sw .vnow b{position:absolute;top:-30px;left:50%;transform:translateX(-50%);padding:5px 10px;border-radius:var(--pill);background:var(--accent-coral);color:#fff;font:700 14px/1 var(--font-sans);white-space:nowrap;box-shadow:0 0 0 5px #fff}
.m5 .tray{flex:1;min-height:0;margin:14px 0 0 24px;border-radius:24px;background:var(--panel);color:var(--ink);display:grid;grid-template-columns:300px minmax(0,1fr);overflow:hidden}
.m5 .tray aside{background:var(--hdr);border-left:6px solid var(--acc);padding:24px 26px}
.m5 .tray aside h2{font:600 34px/1.1 var(--font-display);color:inherit;margin-top:14px}
.m5 .tray aside p{font:600 18px/1.3 var(--font-sans);margin-top:6px}
.m5 .tray aside .big{font:600 60px/1 var(--font-sans);margin:22px 0 12px}
.m5 .tray aside .big span{font-size:26px;margin-left:6px}
.m5 .tray .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;padding:10px 28px;align-content:start}
.m5 .tray .trow{--trow:92px;--tt:22px;border-top:none!important;border-bottom:1px solid var(--hdr)}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="fit" id="fit"><div class="stage" id="stage"></div></div>
<script>
// ---------- sample household ----------
const NOW = 15 * 60 + 10; // 3:10 PM
const DAY0 = 7 * 60, DAY1 = 21 * 60; // 7 AM – 9 PM
const MEMBERS = [
  { id: "dad", name: "Dad", color: "#3f9c92" },
  { id: "mom", name: "Mom", color: "#e0796d" },
  { id: "ellie", name: "Ellie", color: "#9b7fc7" },
  { id: "harper", name: "Harper", color: "#5aa469" },
  { id: "luke", name: "Luke", color: "#dba032" },
];
const ALLDAY = [
  { title: "Grandma visiting", who: [] },
  { title: "Picture Day", who: ["ellie", "harper"] },
];
const EVENTS = [
  { title: "Yoga", s: 480, e: 525, who: ["mom"] },
  { title: "Dentist", s: 540, e: 600, who: ["dad"] },
  { title: "Library visit", s: 630, e: 675, who: ["ellie"] },
  { title: "Science fair setup", s: 660, e: 720, who: ["harper"] },

  const hh = `<div class="swr hh"><div class="who">${ic("home", 24)} Everyone</div><div class="track">${EVENTS.filter((e) => !e.who.length).map((e) => ev(e)).join("")}</div></div>`;
  const row = (m) => {
    const p = prog(m.id), cls = who ? (who === m.id ? " sel" : " thin") : "";
    return `<div class="swr mem${cls}" style="${m.css}"><button class="who" data-who="${m.id}" aria-pressed="${who === m.id}">${av(m, who && who !== m.id ? 40 : 52)}<span style="flex:1;min-width:0"><span class="n">${m.name}</span><small>${p.done}/${p.total} tasks</small>${pbar(m.id)}</span></button><div class="track">${EVENTS.filter((e) => e.who.includes(m.id)).map((e) => ev(e, m.id)).join("")}</div></div>`;
  };
  const now = `<div class="vnow" style="left:calc(232px + (100% - 232px) * ${x(NOW) / 100})"><b>${fmt(NOW)}</b><span class="nowdot"></span></div>`;
  let tray = "";
  if (who) {
    const m = byId[who], p = prog(who), all = tasksOf(who);
    tray = `<div class="tray pal" style="${m.css}"><aside>${av(m, 64)}<h2>${m.name}’s tasks</h2><p>${all.filter((t) => !t.done).length} remaining</p><div class="big">${p.done}<span>/${p.total}</span></div>${pbar(who)}</aside><div class="grid3">${[...sortOpen(all.filter((t) => !t.done)), ...all.filter((t) => t.done)].map(trow).join("")}</div></div>`;
  }
  return `<div class="m5"><div class="sw${who ? "" : " fill"}">${axis}${ad}${hh}${MEMBERS.map(row).join("")}${now}</div>${tray}</div>`;
}

// ---------- shell + routing ----------
const MOCKS = [["Lanes", m1], ["Agenda", m2], ["Board", m3], ["Day Parts", m4], ["Swimlanes", m5]];
const NAV = [["Today", "sun", "coral"], ["Calendar", "calendar", "teal"], ["Lists", "list", "sand"], ["Tasks", "check", "sage"], ["Rewards", "star", "coral"], ["Meals", "utensils", "blush"], ["Recipes", "book", "lilac"], ["Photos", "image", "teal"], ["Sleep", "moon", "lilac"], ["Settings", "settings", null]];
const state = { m: 0, who: "" };
function read() { const q = new URLSearchParams(location.hash.slice(1)); state.m = Math.min(4, Math.max(0, (+q.get("m") || 1) - 1)); state.who = byId[q.get("who")] ? q.get("who") : ""; }
function go(patch) { Object.assign(state, patch); location.hash = `m=${state.m + 1}${state.who ? "&who=" + state.who : ""}`; }
function render() {
  document.getElementById("bar").innerHTML = `<b>Today page</b>${MOCKS.map(([n], i) => `<button data-m="${i}" aria-pressed="${i === state.m}">${i + 1} · ${n}</button>`).join("")}<span>Tap a person to filter · tap again for everyone · checkboxes work</span>`;
  const rail = `<nav class="rail"><div class="brand">F</div><div class="items">${NAV.map(([l, i, t], n) => { const ink = t ? `var(--member-${t}-ink)` : "var(--neutral-700)"; return `<div class="it${n === 0 ? " on" : ""}" style="${n === 0 ? `background:var(--member-${t}-soft);color:${ink};` : ""}${l === "Sleep" ? "margin-top:auto" : ""}"><span style="color:${ink};display:flex">${ic(i, 29)}</span>${l}</div>`; }).join("")}</div></nav>`;
  const everyone = state.who && (state.m === 0 || state.m === 4) ? `<button class="pill-btn" data-who="">${ic("users", 20)} Everyone</button>` : "";
  const hdr = `<header class="hdr"><h1>Today</h1><span class="meta date">Thursday, October 8</span><span class="meta">${fmt(NOW)}</span><span class="meta wx">${ic("cloud", 24)} 64°</span><span class="right">${everyone}</span></header>`;
  document.getElementById("stage").innerHTML = `${rail}<div class="screen">${hdr}<div class="body">${MOCKS[state.m][1](state.who)}</div></div>`;
}
function fit() { const s = Math.min(innerWidth / 1920, (innerHeight - 56) / 1080); const f = document.getElementById("fit"); f.style.transform = `scale(${s})`; f.style.left = `${Math.max(0, (innerWidth - 1920 * s) / 2)}px`; }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-task],[data-who],[data-m]");
  if (!t) return;
  if (t.dataset.task != null) { const k = TASKS[+t.dataset.task]; k.done = !k.done; render(); }
  else if (t.dataset.m != null) go({ m: +t.dataset.m });
  else go({ who: t.dataset.who === state.who ? "" : t.dataset.who });
});
addEventListener("hashchange", () => { read(); render(); });
addEventListener("resize", fit);
read(); render(); fit();
</script>
