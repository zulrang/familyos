<script>
// Model: member IDs own nonnegative integer Star Balances; positive Grants/Spends only.
// Goals and the reward catalog are design proposals. All changes are memory-only.
const icons={star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/>',check:'<path d="m5 12 4 4L19 6"/>',meal:'<path d="M4 3v7h6V3M7 3v18M20 3c-6 4-6 10 0 10V3v18"/>',book:'<path d="M12 6v15M3 3c4 0 7 1 9 3 2-2 5-3 9-3v15c-4 0-7 1-9 3-2-2-5-3-9-3z"/>',photo:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 18 6-6 4 4 4-6 4 5"/>',moon:'<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11z"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13C1 8 7 0 12 8c5-8 11 0 0 0"/>'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[n]||icons.star}</svg>`;
const members=[{id:'ellie',name:'Ellie',balance:4,color:'#a9d8d2',soft:'#d6ece9',ink:'#2c5d58',goal:2},{id:'harper',name:'Harper',balance:3,color:'#dccfea',soft:'#efe8f5',ink:'#54406b',goal:4},{id:'luke',name:'Luke',balance:1,color:'#f6c9c5',soft:'#fbe3e1',ink:'#7d413d',goal:1},{id:'dad',name:'Dad',balance:4,color:'#c8e5cd',soft:'#e5f2e7',ink:'#3a6144',goal:5}];
const rewards=[{name:'Pick the movie',cost:2,icon:'film',desc:'The next family movie night.'},{name:'Extra bedtime story',cost:1,icon:'book',desc:'One more chapter before lights out.'},{name:'Ice cream outing',cost:5,icon:'meal',desc:'A trip to the favorite ice cream shop.'},{name:'Choose dinner',cost:3,icon:'meal',desc:'A favorite meal on the family menu.'},{name:'New book',cost:10,icon:'book',desc:'Something new for the bookshelf.'},{name:'Family game night',cost:4,icon:'gift',desc:'Pick the game. Gather everyone.'}];
const names=['Member columns','Reward catalog','Savings goals','Family overview','Grant & spend','Progress & rewards'];let variant=new URLSearchParams(location.search).get('variant')||'A';if(!'ABCDEF'.includes(variant)||variant.length!==1)variant='A';let selected=0,mode='grant';const adjustments=[];
const theme=m=>`--color:${m.color};--soft:${m.soft};--ink:${m.ink}`;
const avatar=m=>`<span class="avatar" style="${theme(m)}">${m.name[0]}</span>`;
const stars=n=>`<span class="stars">${icon('star')}${n}</span>`;
const stackedStars=()=>`<span class="star-stack" aria-hidden="true">${icon('star')}${icon('star')}${icon('star')}</span>`;
const starTokens=(count,total=count,showNumber=true)=>count>5?`<span class="star-quantity" role="img" aria-label="${count} stars">${showNumber?`<strong>${count}</strong>`:''}${stackedStars()}</span>`:`<span class="star-tokens" role="img" aria-label="${count} ${count===1?'star':'stars'}${total>count?', '+(total-count)+' empty spaces':''}">${Array.from({length:Math.max(count,total)},(_,i)=>i<count?icon('star'):`<span class="missing">${icon('star')}</span>`).join('')}${total===0?'<span class="zero-stars">No stars left</span>':''}</span>`;
const progress=(n,total)=>`<div class="progress" role="progressbar" aria-label="Goal progress" aria-valuenow="${Math.min(n,total)}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${Math.min(100,n/total*100)}%"></span></div>`;
const chips=()=>`<div class="chips">${members.map((m,i)=>`<button class="chip" style="${theme(m)}" data-member="${i}" aria-pressed="${selected===i}">${avatar(m)}${m.name}</button>`).join('')}</div>`;
const spendButton=(r,i,m=members[selected],mi=selected)=>`<button class="${m.balance>=r.cost?'blue':''} wide" data-spend="${i}" data-owner="${mi}" ${m.balance<r.cost?'disabled':''}>${m.balance>=r.cost?'Spend '+r.cost+' stars':(r.cost-m.balance)+' stars to go'}</button>`;
const card=(r,i)=>`<article class="reward"><div class="row spread"><span class="reward-symbol">${icon(r.icon)}</span>${stars(r.cost)}</div><h3>${r.name}</h3><p>${r.desc}</p>${spendButton(r,i)}</article>`;
function variantA(){return `<div class="columns">${members.map((m,i)=>{let r=rewards[m.goal];return `<section class="column" style="${theme(m)}"><div class="member-head"><div class="row">${avatar(m)}<h2>${m.name}</h2></div><div class="balance">${stars(m.balance)}</div><div class="small">Star Balance</div></div><div class="panel"><div class="caption muted">Saving for</div><h3 style="margin-top:16px">${r.name}</h3>${progress(m.balance,r.cost)}<div class="row spread small"><span>${m.balance} / ${r.cost}</span><span>${Math.max(0,r.cost-m.balance)} to go</span></div></div><h3>Ready to spend</h3>${rewards.filter(r=>r.cost<=m.balance).slice(0,2).map(r=>`<div class="panel"><div class="row spread"><strong>${r.name}</strong>${stars(r.cost)}</div><div style="margin-top:16px">${spendButton(r,rewards.indexOf(r),m,i)}</div></div>`).join('')}<button data-adjust="${i}">${icon('plus')} Grant stars</button></section>`}).join('')}</div>`}
function variantB(){let m=members[selected];return `<div class="split"><aside style="${theme(m)}"><div class="panel tinted">${avatar(m)}<h2 style="margin-top:16px">${m.name}</h2><div class="balance">${stars(m.balance)}</div><p class="small">Star Balance</p><button data-adjust="${selected}" class="wide">${icon('plus')} Grant stars</button></div><div class="section-title"><h3>Family members</h3></div>${members.map((m,i)=>`<button class="member-select" data-member="${i}" style="${theme(m)}" aria-pressed="${selected===i}">${m.name}${stars(m.balance)}</button>`).join('')}</aside><section><div class="row spread" style="margin-bottom:22px"><div><h2>A little something to look forward to</h2><div class="sub">Choose a reward for ${m.name}.</div></div></div><div class="catalog">${rewards.map(card).join('')}</div></section></div>`}
function variantC(){let m=members[selected],r=rewards[m.goal];return `${chips()}<section class="hero" style="${theme(m)};margin-top:24px"><div><div class="caption">${m.name}’s next reward</div><h2>${r.name}</h2><p>${r.desc}</p><div style="max-width:290px;margin-top:24px">${spendButton(r,m.goal)}</div></div><div class="ring"><strong>${m.balance} / ${r.cost}</strong><small>${Math.max(0,r.cost-m.balance)} stars to go</small></div></section><div class="section-title"><h2>Something else to save for</h2><span class="muted small">Choose one goal</span></div><div class="goals">${rewards.filter((_,i)=>i!==m.goal).slice(0,3).map(r=>`<article class="panel"><div class="row spread"><h3>${r.name}</h3>${stars(r.cost)}</div><p class="sub">${r.desc}</p><button class="wide" data-goal="${rewards.indexOf(r)}">Save for this</button></article>`).join('')}</div>`}
function variantD(){return `<div class="overview"><section><h2>Everyone’s progress</h2><p class="sub">A little effort, something to look forward to.</p>${members.map((m,i)=>{let r=rewards[m.goal];return `<div class="member-row" style="${theme(m)}"><div class="row">${avatar(m)}<strong>${m.name}</strong></div>${stars(m.balance)}<div class="small">${r.name}${progress(m.balance,r.cost)}<span>${m.balance} / ${r.cost}</span></div></div>`}).join('')}<div class="section-title"><h2>Recent Star Adjustments</h2></div><div class="panel">${adjustmentHistory()}</div></section><section><h2 style="margin-bottom:20px">Ready for a little family time</h2>${[0,3,5].map(i=>{let r=rewards[i];let eligible=members.filter(m=>m.balance>=r.cost);return `<article class="ticket"><div><div class="row"><span class="reward-symbol">${icon(r.icon)}</span><h3>${r.name}</h3></div><p class="sub">${eligible.map(m=>m.name).join(', ')} can spend ${r.cost} stars.</p></div><button data-browse="${i}" aria-label="Choose a member for ${r.name}">${icon('right')}</button></article>`}).join('')}<div class="panel"><h3>Small things count</h3><p class="sub">Completed tasks add stars to each member’s Star Balance.</p><button data-variant="E">Grant or spend stars ${icon('right')}</button></div></section></div>`}
function adjustmentHistory(memberName){const entries=adjustments.filter(a=>!memberName||a.name===memberName);return entries.length?entries.slice().reverse().slice(0,5).map(a=>`<div class="activity"><div><strong>${a.name}</strong><div class="sub">${a.reason}</div></div><strong>${a.delta>0?'+':''}${a.delta}</strong></div>`).join(''):'<div class="empty">No Star Adjustments in this preview yet.</div>'}
function variantE(){
 const m=members[selected];
 return `<div class="admin-intro"><h1>Manage stars</h1><p class="sub">Grant or spend stars with a recorded reason.</p></div><section aria-label="Choose a member"><h3>Members</h3><div class="admin-members">${members.map((person,i)=>`<button class="admin-member" style="${theme(person)}" data-member="${i}" aria-pressed="${selected===i}">${avatar(person)}<span class="admin-member-copy"><strong>${person.name}</strong>${stars(person.balance)}</span></button>`).join('')}</div></section><section class="admin-card" style="${theme(m)}"><div class="admin-balance"><div><h2>${m.name}</h2><div class="sub">Star Balance</div></div>${stars(m.balance)}</div><div class="segmented" role="group" aria-label="Adjustment type"><button data-mode="grant" aria-pressed="${mode==='grant'}">Grant</button><button data-mode="spend" aria-pressed="${mode==='spend'}">Spend</button></div><form id="adjustment"><label for="amount">Number of stars</label><input id="amount" name="amount" inputmode="numeric" type="number" min="1" max="${mode==='spend'?m.balance:9999}" step="1" value="1" required><div class="amount-options" aria-label="Star amounts">${[1,3,5].map(n=>`<button type="button" data-amount="${n}" ${mode==='spend'&&n>m.balance?'disabled':''}>${n}</button>`).join('')}</div><label for="reason">Reason</label><textarea id="reason" name="reason" maxlength="1000" required placeholder="${mode==='grant'?'Helping with the garden':'Ice cream outing'}"></textarea><div class="balance-preview"><span>Balance after ${mode==='grant'?'Grant':'Spend'}</span><output id="balance-after" aria-live="polite">${m.balance+(mode==='grant'?1:-1)>=0?`<strong>${m.balance+(mode==='grant'?1:-1)}</strong> stars`:'Not enough stars'}</output></div><button class="blue wide" type="submit" ${mode==='spend'&&m.balance===0?'disabled':''}>${mode==='grant'?'Grant':'Spend'} stars</button><p class="sub small">A reason is saved with each adjustment.</p></form></section><section class="admin-card admin-history"><h2>${m.name}’s Star Adjustments</h2>${adjustmentHistory(m.name)}<p class="sub">Task completion corrections appear under Tasks → Completions.</p></section>`;
}
function updateBalancePreview(){
 const amount=Number(document.querySelector('#amount').value),balance=members[selected].balance+(mode==='grant'?amount:-amount);
 document.querySelector('#balance-after').innerHTML=!Number.isSafeInteger(amount)||amount<1?'Enter a whole number':balance<0?'Not enough stars':`<strong>${balance}</strong> stars`;
}
function variantF(){
 const selectedMember=members[selected];
 return `<div class="progress-catalog"><aside aria-label="Member goal progress"><p class="sub">Select a member to choose a reward.</p>${members.map((m,i)=>{
  const goal=rewards[m.goal],isSelected=selected===i;
  return `<button class="progress-choice" style="${theme(m)}" data-member="${i}" aria-pressed="${isSelected}" aria-label="Select ${m.name}, ${m.balance} stars, goal ${goal.name}"><span class="row spread"><span class="row">${avatar(m)}<strong>${m.name}</strong></span><span class="row">${stars(m.balance)}<span class="selection-mark">${isSelected?icon('check'):''}</span></span></span><span><span class="member-goal">${goal.name}</span>${progress(m.balance,goal.cost).replaceAll('<div','<span').replaceAll('</div>','</span>')}<span class="row spread small"><span>${m.balance} / ${goal.cost} stars</span><span>${m.balance>=goal.cost?'Ready to spend':(goal.cost-m.balance)+' to go'}</span></span></span></button>`;
 }).join('')}</aside><section aria-label="Reward choices" style="${theme(selectedMember)}"><div class="catalog-heading"><div><h2>Rewards for ${selectedMember.name}</h2><p class="sub">Spend stars now or choose a new goal.</p></div><span class="catalog-balance" aria-label="${selectedMember.name} Star Balance ${selectedMember.balance}"><span class="catalog-balance-label">${selectedMember.name}’s Star Balance</span>${stars(selectedMember.balance)}</span></div><div class="catalog">${rewards.map((r,i)=>{
  const isGoal=selectedMember.goal===i;
  return `<article class="reward ${isGoal?'is-goal':''}"><div class="row spread"><span class="reward-symbol">${icon(r.icon)}</span><span class="reward-cost" aria-label="${r.cost} stars"><strong>${r.cost}</strong>${starTokens(r.cost,r.cost,false)}</span></div><h3>${r.name}</h3><p>${r.desc}</p><span class="reward-availability">${selectedMember.balance>=r.cost?icon('check')+'Ready':'Keep collecting'}</span><div class="reward-actions"><button class="${selectedMember.balance>=r.cost?'blue':''} wide" data-spend="${i}" data-owner="${selected}" ${selectedMember.balance<r.cost?'disabled':''}>Spend</button><button class="wide" data-goal="${i}" ${isGoal?'disabled aria-current="true"':''}>${isGoal?icon('check')+'Current goal':'Set as goal'}</button></div></article>`;
 }).join('')}</div></section></div>`;
}
function render(){document.body.classList.toggle('admin-preview',variant==='E');document.querySelector('#app').innerHTML=`${variant==='E'?`<header class="admin-header"><div class="admin-brand"><span class="admin-mark">f</span><span>FamilyOS<small>For parents</small></span></div><span class="preview-label">Admin preview</span></header><nav class="admin-nav" aria-label="Parent admin preview"><span>Home</span><span>Tasks</span><span>Members</span><span aria-current="page">Stars</span></nav>`:`<header><div><h1>Rewards</h1><div class="sub">Small efforts. Happy moments.</div></div><div class="row"><span class="muted small">Miller Family</span><button data-variant="E">${icon('star')} Manage stars</button></div></header>`}${[variantA,variantB,variantC,variantD,variantE,variantF]['ABCDEF'.indexOf(variant)]()}<p class="notice">Mockup ${variant} · ${names['ABCDEF'.indexOf(variant)]} · Sample family · Changes reset on reload</p>`;document.querySelector('.switcher').innerHTML=`<button data-cycle="-1" aria-label="Previous mockup">${icon('left')}</button><span class="label">6 REWARDS MOCKUPS</span>${[...'ABCDEF'].map((v,i)=>`<button data-variant="${v}" aria-label="${v}: ${names[i]}" aria-pressed="${v===variant}">${v}</button>`).join('')}<button data-cycle="1" aria-label="Next mockup">${icon('right')}</button>`;document.title=`${variant} · ${names['ABCDEF'.indexOf(variant)]} · Rewards`;}
function setVariant(v){variant=v;let u=new URL(location.href);u.searchParams.set('variant',v);historyReplace(u);render()}function historyReplace(u){window.history.replaceState(null,'',u)}
function cycle(n){setVariant('ABCDEF'[('ABCDEF'.indexOf(variant)+n+6)%6])}
function notify(s){document.querySelector('.toast').textContent=s;setTimeout(()=>document.querySelector('.toast').textContent='',3200)}
const escapeText=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function visualSpend(r,ri,m,mi){
 const remaining=m.balance-r.cost;
 return `<div class="row">${avatar(m)}<h2 id="spend-title">${m.name}’s choice</h2></div><div class="spend-now"><strong>Stars now</strong>${starTokens(m.balance)}</div><div class="spend-groups"><section class="spend-group give" aria-label="Stars spent on reward"><span class="reward-symbol">${icon(r.icon)}</span><h3>${r.name}</h3><strong>These stars buy this</strong>${starTokens(r.cost)}</section><section class="spend-group keep" aria-label="Stars left after spending">${avatar(m)}<h3>Stars to keep</h3><strong>${remaining===0?'All stars go to this reward':'These stars stay'}</strong>${starTokens(remaining)}</section></div><div class="row dialog-actions"><button data-cancel>Keep saving</button><button class="blue" data-confirm="${ri}" data-owner="${mi}">${icon('check')} Choose reward</button></div>`;
}
function adjust(mi,delta,reason){let m=members[mi];if(!Number.isSafeInteger(delta)||!delta||!Number.isSafeInteger(m.balance+delta)||m.balance+delta<0)return false;m.balance+=delta;adjustments.push({name:m.name,delta,reason:escapeText(reason|| (delta>0?'Grant':'Spend'))});render();notify(`${m.name} · ${m.balance} stars`);return true}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.amount){document.querySelector('#amount').value=d.amount;updateBalancePreview()}if(d.variant)setVariant(d.variant);if(d.cycle)cycle(Number(d.cycle));if(d.member!==undefined){selected=Number(d.member);render()}if(d.adjust!==undefined){selected=Number(d.adjust);mode='grant';setVariant('E')}if(d.mode){mode=d.mode;render()}if(d.goal!==undefined){members[selected].goal=Number(d.goal);render();notify('Goal selected')}if(d.browse!==undefined){selected=members.findIndex(m=>m.balance>=rewards[Number(d.browse)].cost);setVariant('B')}if(d.spend!==undefined){let ri=Number(d.spend),mi=Number(d.owner),r=rewards[ri],m=members[mi];let dialog=document.querySelector('dialog');dialog.className=variant==='F'?'visual-spend':'';dialog.style.cssText=theme(m);dialog.setAttribute('aria-label',r.name+' spending confirmation');dialog.innerHTML=variant==='F'?visualSpend(r,ri,m,mi):`<h2>${r.name}</h2><p>Spend ${r.cost} stars from ${m.name}’s Star Balance?</p><p class="sub">${m.balance} stars → ${m.balance-r.cost} stars</p><div class="row"><button data-cancel>Cancel</button><button class="blue" data-confirm="${ri}" data-owner="${mi}">Spend ${r.cost} stars</button></div>`;dialog.showModal()}if(d.cancel!==undefined)document.querySelector('dialog').close();if(d.confirm!==undefined){let r=rewards[Number(d.confirm)];adjust(Number(d.owner),-r.cost,r.name);document.querySelector('dialog').close()}});
document.addEventListener('input',e=>{if(e.target.id==='amount')updateBalancePreview()});
document.addEventListener('submit',e=>{if(e.target.id!=='adjustment')return;e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(amount>0)adjust(selected,mode==='grant'?amount:-amount,String(f.get('reason')))});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('dialog').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
document.querySelector('.rail').innerHTML='<div class="brand">F</div>'+[['Calendar','calendar'],['Lists','list'],['Tasks','check'],['Rewards','star'],['Meals','meal'],['Recipes','book'],['Photos','photo'],['Sleep','moon'],['Settings','settings']].map(([label,n])=>`<div class="nav-item ${label==='Rewards'?'active':''} ${label==='Sleep'?'bottom':''}" ${label==='Rewards'?'aria-current="page"':''}>${icon(n)}${label}</div>`).join('');render();
</script></body></html>
